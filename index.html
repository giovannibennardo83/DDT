<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="styles.css" />
    <title>DDT Manager</title>
  </head>
  <body>
    <header>
      <h1>DDT Manager</h1>
      <p>Crea, modifica e stampa Documenti di Trasporto</p>
    </header>

    <main>
      <form id="ddt-form" novalidate>
        <h2 id="form-title">Nuovo DDT</h2>
        <label>
          Numero DDT
          <input type="text" id="numero" readonly />
          <small class="error-message"></small>
        </label>
        <label>
          Data
          <input type="date" id="data" required />
          <small class="error-message"></small>
        </label>

        <h3>Cliente / Destinatario</h3>
        <label>
          Cliente riga 1
          <input type="text" id="cliente_riga1" placeholder="Struttura / Cliente" required />
          <small class="error-message"></small>
        </label>
        <label>
          Cliente riga 2
          <input type="text" id="cliente_riga2" placeholder="Reparto / riferimento" />
          <small class="error-message"></small>
        </label>
        <label>
          Cliente riga 3
          <input type="text" id="cliente_riga3" placeholder="Indirizzo / città" />
          <small class="error-message"></small>
        </label>

        <label>
          Causale del trasporto
          <textarea id="causale_trasporto" rows="2"></textarea>
          <small class="error-message"></small>
        </label>

        <div class="rows-header">
          <h3>Righe DDT</h3>
          <button type="button" id="add-row">Aggiungi riga</button>
        </div>

        <div class="righe-head">
          <strong>Ref</strong>
          <strong>Descrizione</strong>
          <strong>Lot</strong>
          <strong>Quantità</strong>
        </div>
        <div id="righe-container" class="righe-grid" role="table" aria-label="Righe DDT"></div>
        <div class="ocr-document-card" aria-label="OCR documento completo">
          <h4 class="ocr-title">OCR documento (scarico sala operatoria)</h4>
          <p class="ocr-subtitle">Scansiona tutto il foglio per compilare automaticamente il DDT</p>
          <div class="ocr-actions ocr-actions-document">
            <button type="button" id="ocr-scarico-btn" class="secondary">📷 Scatta foto documento</button>
            <button type="button" id="ocr-scarico-gallery-btn" class="secondary">🖼️ Carica documento</button>
          </div>
        </div>
        <p id="ocr-status" class="ocr-status" aria-live="polite"></p>
        <img id="ocr-preview" class="ocr-preview" alt="Anteprima immagine compressa per OCR" hidden />
        <input
          type="file"
          id="ocr-input-camera"
          accept="image/*"
          capture="environment"
          hidden
        />
        <input
          type="file"
          id="ocr-input-gallery"
          accept="image/*"
          hidden
        />
        <input
          type="file"
          id="ocr-scarico-input-camera"
          accept="image/*"
          capture="environment"
          hidden
        />
        <input
          type="file"
          id="ocr-scarico-input-gallery"
          accept="image/*"
          hidden
        />

        <h3>Sezione finale</h3>
        <label>
          Iniziali Paziente
          <input type="text" id="iniziali_paziente" />
          <small class="error-message"></small>
        </label>
        <label>
          N. cartella Clinica
          <input type="text" id="cartella_clinica" />
          <small class="error-message"></small>
        </label>

        <div class="actions">
          <button type="submit" id="save-ddt-btn">Salva DDT</button>
          <button id="new-ddt-btn" type="button">Nuovo DDT</button>
          <button type="button" id="cancel-edit" class="secondary" hidden>Annulla modifica</button>
          <button type="button" id="firma-destinatario-btn" class="secondary">Firma destinatario</button>
          <button type="button" id="print-last" class="secondary">Stampa ultimo</button>
        </div>
      </form>

      <section>
        <h2>Archivio DDT</h2>
        <ul id="ddt-list"></ul>
      </section>
    </main>



    <div id="firma-modal" class="modal-overlay" hidden>
      <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="firma-modal-title">
        <h3 id="firma-modal-title">Firma destinatario</h3>
        <canvas id="firma-canvas" aria-label="Area firma destinatario"></canvas>
        <div class="modal-actions">
          <button type="button" id="close-firma-modal" class="secondary">Chiudi</button>
        </div>
      </div>
    </div>

    <p id="save-status" class="save-status" aria-live="polite"></p>
    <script src="db.js"></script>
    <script src="app.js"></script>
  </body>
</html>
